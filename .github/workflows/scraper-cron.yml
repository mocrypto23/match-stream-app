name: Scrape matches (10m)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_my_scraper]
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: scrape-matches
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Africa/Cairo

    steps:
      - name: Gate (dispatch/manual runs, hourly schedule runs)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "event=${EVENT_NAME}"
          echo "cairo_now=$(date '+%F %T %Z')"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkout
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: npm ci

      - name: Install Playwright (Chromium)
        if: steps.gate.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run scraper (headless)
        if: steps.gate.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RPC_NAME: refresh_match_stream_app
          CONCURRENCY: 3
          HEADLESS: 1
          DEBUG: 0
          DIAG: 0
          LIST_TIMEOUT_MS: 45000
          DEEP_TIMEOUT_MS: 30000
          HTTP_TIMEOUT_MS: 12000
          SCRAPE_DAY_SCOPE: today_only
          PRESERVE_FUTURE_ROWS: 0
          CLEANUP_OLD_FINISHED: 1
        run: node scraper.js

      - name: Trigger on-demand revalidation
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "${SITE_URL}" ] || [ -z "${REVALIDATE_SECRET}" ]; then
            echo "SITE_URL or REVALIDATE_SECRET is missing"
            exit 1
          fi

          BASE_URL="${SITE_URL%/}"
          case "${BASE_URL}" in
            http://*|https://*) ;;
            *) BASE_URL="https://${BASE_URL}" ;;
          esac

          BODY='{"paths":["/","/watch/[id]"]}'
          HTTP_CODE=$(curl -sS -L --max-redirs 5 -o /tmp/revalidate.json -w "%{http_code}" \
            -X POST "${BASE_URL}/api/revalidate" \
            -H "Content-Type: application/json" \
            -H "x-revalidate-secret: ${REVALIDATE_SECRET}" \
            --data "${BODY}")

          cat /tmp/revalidate.json || true

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "revalidation failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
