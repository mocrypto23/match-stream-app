name: Scrape matches (15m)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_my_scraper]
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: scrape-matches
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Gate (Egypt time + slot)
        id: gate
        env:
          TZ: Africa/Cairo
        run: |
          H=$(date +%H)
          M=$(date +%M)
          D=$(date +%F)

          if [ "$H" -lt 14 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MM=$((10#$M))
          R=$((MM % 15))

          if [ "$R" -gt 8 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SLOT_MIN=$((MM - R))
          SLOT=$(printf "%s-%02d-%02d" "$D" "$H" "$SLOT_MIN")

          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Restore slot cache (skip if already ran)
        id: slotcache
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .slot
          key: scrape-slot-${{ steps.gate.outputs.slot }}

      - name: Stop if slot already executed
        if: steps.gate.outputs.should_run == 'true' && steps.slotcache.outputs.cache-hit == 'true'
        run: exit 0

      - name: Checkout
        if: steps.gate.outputs.should_run == 'true' && steps.slotcache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.gate.outputs.should_run == 'true' && steps.slotcache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true' && steps.slotcache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright (Chromium)
        if: steps.gate.outputs.should_run == 'true' && steps.slotcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Show revision + scraper fingerprint
        if: steps.gate.outputs.should_run == 'true' && steps.slotcache.outputs.cache-hit != 'true'
        run: |
          echo "=== REVISION ==="
          git rev-parse HEAD
          echo "=== scraper.js info ==="
          ls -la scraper.js
          wc -l scraper.js
          node -e "const fs=require('fs');const crypto=require('crypto');const b=fs.readFileSync('scraper.js');console.log('sha256='+crypto.createHash('sha256').update(b).digest('hex'))"
          echo "=== node/playwright ==="
          node -v
          npx playwright --version

      - name: Run scraper (headless)
        if: steps.gate.outputs.should_run == 'true' && steps.slotcache.outputs.cache-hit != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RPC_NAME: refresh_match_stream_app
          CONCURRENCY: 3
          HEADLESS: 1
          DEBUG: 0
          DIAG: 0
          LIST_TIMEOUT_MS: 45000
          DEEP_TIMEOUT_MS: 30000
          HTTP_TIMEOUT_MS: 12000
          SCRAPE_DAY_SCOPE: today_only
          PRESERVE_FUTURE_ROWS: 0
          CLEANUP_OLD_FINISHED: 1
          TZ: Africa/Cairo
        run: node scraper.js

      - name: Trigger on-demand revalidation
        if: steps.gate.outputs.should_run == 'true' && steps.slotcache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "${SITE_URL}" ] || [ -z "${REVALIDATE_SECRET}" ]; then
            echo "SITE_URL or REVALIDATE_SECRET is missing"
            exit 1
          fi

          BASE_URL="${SITE_URL%/}"
          case "${BASE_URL}" in
            http://*|https://*) ;;
            *) BASE_URL="https://${BASE_URL}" ;;
          esac

          BODY='{"paths":["/","/watch/[id]"]}'
          HTTP_CODE=$(curl -sS -L --max-redirs 5 -o /tmp/revalidate.json -w "%{http_code}" \
            -X POST "${BASE_URL}/api/revalidate" \
            -H "Content-Type: application/json" \
            -H "x-revalidate-secret: ${REVALIDATE_SECRET}" \
            --data "${BODY}")

          cat /tmp/revalidate.json || true

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "revalidation failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

      - name: Diagnose Supabase rows (today)
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TABLE_NAME: match-stream-app
        run: node scripts/diag-supabase.js

      - name: Probe site rendering (runner)
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          HEADLESS: 1
          TZ: Africa/Cairo
          DIAG_GOTO_TIMEOUT_MS: 15000
          DIAG_GOTO_RETRIES: 1
        run: node scripts/diag-site.js

      - name: List diagnostics files
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          echo "=== diag tree ==="
          ls -la
          ls -la diag || true
          find diag -type f -maxdepth 3 -print || true

      - name: Upload diagnostics
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: diag
          if-no-files-found: warn

      - name: Upload debug.png if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug.png
          if-no-files-found: ignore

      - name: Prepare slot marker
        if: success() && steps.gate.outputs.should_run == 'true' && steps.slotcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .slot
          echo "${{ steps.gate.outputs.slot }}" > .slot/slot.txt

      - name: Save slot cache
        if: success() && steps.gate.outputs.should_run == 'true' && steps.slotcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .slot
          key: scrape-slot-${{ steps.gate.outputs.slot }}
