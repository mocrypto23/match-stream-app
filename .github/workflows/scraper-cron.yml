name: Scrape matches (20m)

on:
  workflow_dispatch:
    inputs:
      ci_speedup_enabled:
        description: "Enable CI speed optimizations (on/off)"
        required: false
        default: "on"
        type: choice
        options:
          - on
          - off
  repository_dispatch:
    types: [run_my_scraper]

concurrency:
  group: scrape-matches
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Africa/Cairo
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

    steps:
      - name: Gate (manual/dispatch runs)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "event=${EVENT_NAME}"
          echo "cairo_now=$(date '+%F %T %Z')"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Resolve speed toggle
        id: speed
        if: steps.gate.outputs.should_run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_INPUT: ${{ github.event.inputs.ci_speedup_enabled }}
          PAYLOAD_INPUT: ${{ github.event.client_payload.ci_speedup_enabled }}
        run: |
          raw=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${DISPATCH_INPUT}" ]; then
            raw="${DISPATCH_INPUT}"
          elif [ -n "${PAYLOAD_INPUT}" ]; then
            raw="${PAYLOAD_INPUT}"
          else
            raw="on"
          fi

          norm="$(printf '%s' "${raw}" | tr '[:upper:]' '[:lower:]' | xargs)"
          enabled="false"
          case "${norm}" in
            on|true|1|yes) enabled="true" ;;
            *) enabled="false" ;;
          esac

          suffix="legacy"
          if [ "${enabled}" = "true" ]; then
            suffix="fast"
          fi

          echo "speedup_enabled=${enabled}" >> "$GITHUB_OUTPUT"
          echo "playwright_cache_key_suffix=${suffix}" >> "$GITHUB_OUTPUT"
          echo "CI speedup enabled: ${enabled}"
          echo "Speed mode: ${suffix}-path"

      - name: Checkout (fast path)
        if: steps.gate.outputs.should_run == 'true' && steps.speed.outputs.speedup_enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout (legacy path)
        if: steps.gate.outputs.should_run == 'true' && steps.speed.outputs.speedup_enabled != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies (fast path)
        if: steps.gate.outputs.should_run == 'true' && steps.speed.outputs.speedup_enabled == 'true'
        run: npm ci --omit=dev --no-audit --no-fund --prefer-offline

      - name: Install dependencies (legacy path)
        if: steps.gate.outputs.should_run == 'true' && steps.speed.outputs.speedup_enabled != 'true'
        run: npm ci

      - name: Cache Playwright browsers (fast path)
        id: pw-cache
        if: steps.gate.outputs.should_run == 'true' && steps.speed.outputs.speedup_enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.speed.outputs.playwright_cache_key_suffix }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.speed.outputs.playwright_cache_key_suffix }}-
            ${{ runner.os }}-playwright-

      - name: Install Playwright (Chromium - fast path)
        if: steps.gate.outputs.should_run == 'true' && steps.speed.outputs.speedup_enabled == 'true'
        run: |
          echo "[fast-path] cache-hit=${{ steps.pw-cache.outputs.cache-hit }}"
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium || npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Install Playwright (Chromium - legacy path)
        if: steps.gate.outputs.should_run == 'true' && steps.speed.outputs.speedup_enabled != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run scraper (headless)
        if: steps.gate.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RPC_NAME: refresh_match_stream_app
          CONCURRENCY: 3
          HEADLESS: 1
          DEBUG: 0
          DIAG: 0
          LIST_TIMEOUT_MS: 45000
          DEEP_TIMEOUT_MS: 30000
          HTTP_TIMEOUT_MS: 12000
          SCRAPE_DAY_SCOPE: today_only
          PRESERVE_FUTURE_ROWS: 0
          CLEANUP_OLD_FINISHED: 1
        run: node scraper.js

      - name: Trigger on-demand revalidation
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "${SITE_URL}" ] || [ -z "${REVALIDATE_SECRET}" ]; then
            echo "SITE_URL or REVALIDATE_SECRET is missing"
            exit 1
          fi

          BASE_URL="${SITE_URL%/}"
          case "${BASE_URL}" in
            http://*|https://*) ;;
            *) BASE_URL="https://${BASE_URL}" ;;
          esac

          BODY='{"paths":["/","/watch/[id]"]}'
          HTTP_CODE=$(curl -sS -L --max-redirs 5 -o /tmp/revalidate.json -w "%{http_code}" \
            -X POST "${BASE_URL}/api/revalidate" \
            -H "Content-Type: application/json" \
            -H "x-revalidate-secret: ${REVALIDATE_SECRET}" \
            --data "${BODY}")

          cat /tmp/revalidate.json || true

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "revalidation failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
